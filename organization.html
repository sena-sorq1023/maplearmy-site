function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
function derive(pass){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']).then(function(m){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:250000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},true,['decrypt']);

}
function reveal(key){

    document.body.querySelectorAll('script').forEach(function(o){var s=document.createElement('script');s.textContent=o.textContent;o.replaceWith(s);});

  });
}
function remember(key){

  });
});
