<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>メンテナンス中 | MAPLE ARMY</title>
<style>
:root { --bg: #0B0B0B; --fg: #F4F2EF; --sub: #A9A7A3; --line: #2E2E30; --accent: #E0262B; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); }
body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
  font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
  background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size: 48px 48px; }
main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 16px; }
.box { width: 100%; max-width: 640px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 28px; }
.logo { width: 300px; max-width: 70vw; height: auto; display: block; }
.label { font: 700 13px/1 ui-monospace, "SFMono-Regular", Menlo, monospace; letter-spacing: .32em; color: var(--accent); }
h1 { margin: 0; font-weight: 900; font-size: clamp(24px, 6vw, 40px); line-height: 1.35; word-break: auto-phrase; }
p { margin: 0; word-break: auto-phrase; font-size: 15px; line-height: 1.9; color: #D9D6D1; }
dl { margin: 0; width: 100%; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  display: grid; grid-template-columns: auto 1fr; text-align: left; font-size: 14px; line-height: 1.7; }
dt { padding: 14px 20px 14px 0; color: var(--sub); font-weight: 700; white-space: nowrap; }
dd { margin: 0; padding: 14px 0; word-break: auto-phrase; }
dt + dd ~ dt, dt + dd ~ dt + dd { border-top: 1px solid var(--line); }
a { color: var(--fg); }
footer { padding: 24px 16px 32px; text-align: center; font: 500 11px/1.6 ui-monospace, Menlo, monospace; letter-spacing: .14em; color: #77746F; }
</style>
</head>
<body>
<main>
<div class="box">
<img class="logo" src="/maintenance-logo.webp" alt="MAPLE ARMY">
<span class="label">MAINTENANCE</span>
<h1>ただいまメンテナンス中です</h1>
<p>現在、サイトの点検のため一時的に公開を停止しています。<br>ご不便をおかけしますが、再開まで今しばらくお待ちください。</p>
<dl>
<dt>開始</dt><dd>2026年11月19日(木) 23:00</dd>
<dt>終了</dt><dd>点検が完了しだい再開します</dd>
<dt>お知らせ</dt><dd>最新情報は X <a href="https://x.com/SENASTUDIO_JP">@SENASTUDIO_JP</a> でお知らせします</dd>
</dl>
</div>
</main>
<footer>© 2025–2026 SENA STUDIO. MAPLE ARMY is a brand of SENA STUDIO.</footer>
</body>
</html>
